feature: 2026-06-09-dept-management
created: 2026-06-09

steps:
  - action: "数据库初始化：在 schema.sql 中编写 sys_department 建表、sys_user 新增字段与菜单权限 SQL 并在 SQLite 中执行"
    exit_signal: "数据库 sys_department 表与 sys_user.dept_id 列存在，sys_menu 含有部门管理菜单记录"
    status: done
  - action: "后端部门 CRUD 接口实现：创建 Department 相关的 Entity、Mapper、Service 与 Controller，实现部门 CRUD 与状态切换"
    exit_signal: "部门管理接口可通过 REST 客户端测通，单元测试正常运行并覆盖核心方法"
    status: done
  - action: "后端用户管理适配：在 User/UserVO 引入部门关联，修改用户保存逻辑（含部门合法性校验）和列表查询逻辑（联表查出部门名称）"
    exit_signal: "修改后后端单元测试（如 UserManagementServiceTest）全部通过，且接口能正确带出部门名称"
    status: done
  - action: "前端部门管理页面开发：新建 api/dept.js 并在 views/system/ 新建 DeptManagement.vue 实现 CRUD 页面"
    exit_signal: "能够正常访问 /system/departments 路由，完成部门的列表渲染与表单增删改查"
    status: done
  - action: "前端用户管理功能适配：修改 UserManagement.vue 页面展示所属部门，并能通过树下拉组件（el-tree-select）保存部门"
    exit_signal: "用户列表显示所属部门，编辑用户时可以通过树下拉框分配部门并成功保存，整链路联通"
    status: done

